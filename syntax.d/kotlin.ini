name=Kotlin
extensions=kt, kts
highlight_numbers=true
singleline_string_quotes=", '
singleline_comment_start=//
multiline_comment_delims=/*, */
# Keyword colors merged with the bat syntaxes by scripts/import_bat_syntaxes.py
highlight_operators=true
highlight_punctuation=true
type_definition_keywords=class, interface, object
function_definition_keywords=fun
keywords_1=abstract, actual, as, break, by, catch, class, continue, companion, const, constructor, data, do, else, enum, final, finally, for, fun, get, if, import, in, inner, interface, is, lateinit, noinline, object, open, operator, out, override, package, private, protected, public, reified, return, sealed, set, suspend, throw, try, typealias, val, var, vararg, when, where, while, Byte, Double, Float, Int, Long, Short, String, Unit, Boolean, value, annotation, crossinline, expect, external, infix, inline, internal, tailrec, until, init
keywords_2=false, true
builtins=null, super, this
types=dynamic
