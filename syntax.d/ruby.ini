name=Ruby
extensions=rb
highlight_numbers=true
singleline_string_quotes=", '
singleline_comment_start=//
multiline_comment_delims=/*, */
# Keyword colors merged with the bat syntaxes by scripts/import_bat_syntaxes.py
highlight_operators=true
highlight_punctuation=true
type_definition_keywords=class, module
function_definition_keywords=def
highlight_parameters=true
keywords_1=alias, begin, break, case, class, def, defined, do, else, elsif, end, ensure, for, if, module, next, redo, rescue, retry, return, then, undef, unless, until, when, while, yield, alias_method, catch, fail, raise, throw, loop, attr, attr_accessor, attr_reader, attr_writer, extend, include, initialize, module_function, new, prepend, private, protected, public, gem, require, require_relative
keywords_2=ENV
builtins=false, nil, super, true
functions=BEGIN, END
operators=and, in, not, or
