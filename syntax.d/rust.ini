name=Rust
extensions=rs
highlight_numbers=true
singleline_string_quotes="
singleline_comment_start=//
multiline_comment_delims=/*, */
; In Rust, the multi-line string delimiter is the same as the single-line string delimiter
multiline_string_delim="
# Keyword colors merged with the bat syntaxes by scripts/import_bat_syntaxes.py
highlight_function_calls=true
plain_path_calls=true
plain_capitalized_calls=true
highlight_operators=true
highlight_punctuation=true
attributes=true
type_definition_keywords=enum, impl, let, struct, trait, type
function_definition_keywords=fn
highlight_parameters=true
keywords_1=async, await, break, const, continue, crate, dyn, else, enum, extern, fn, for, if, impl, let, loop, match, mod, move, mut, pub, ref, return, Self, static, struct, super, trait, try, type, unsafe, use, where, while, i8, i16, i32, i64, i128, isize, u8, u16, u32, u128, usize, f32, f64, bool, char, str, u64, block, expr, ident, item, meta, pat, path, stmt, tt, ty, br
builtins=false, true
types=abstract, AsMut, AsRef, Box, Clone, Copy, Default, DoubleEndedIterator, Drop, Eq, Err, ExactSizeIterator, Extend, Fn, FnMut, FnOnce, From, Into, IntoIterator, Iterator, None, Ok, Option, Ord, PartialEq, PartialOrd, Result, Send, Sized, SliceConcatExt, Some, String, Sync, ToOwned, ToString, Vec
operators=as, box, in
