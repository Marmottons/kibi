name=C++
extensions=cpp, hpp, cc, cxx, hxx
highlight_numbers=true
singleline_string_quotes=", '
singleline_comment_start=//
multiline_comment_delims=/*, */
# Keyword colors merged with the bat syntaxes by scripts/import_bat_syntaxes.py
highlight_function_calls=true
highlight_operators=true
highlight_punctuation=true
keywords_1=alignas, alignof, and, and_eq, bitand, bitor, break, case, catch, char16_t, char32_t, class, compl, const, constexpr, const_cast, continue, decltype, default, delete, do, dynamic_cast, else, enum, explicit, export, extern, for, friend, goto, if, inline, mutable, namespace, new, noexcept, not, not_eq, operator, or, or_eq, private, protected, public, register, reinterpret_cast, return, sizeof, static, static_assert, static_cast, struct, switch, template, thread_local, throw, try, typedef, typeid, typename, union, using, virtual, void, volatile, wchar_t, while, xor, xor_eq, __restrict, __restrict__, restrict, _Pragma, nullptr_t, LR, UR, u8R, uR, final, override, __attribute__, align, allocate, code_seg, deprecated, property, uuid, __declspec, defined
builtins=nullptr
functions=asm, atomic_cancel, atomic_commit, atomic_noexcept, bool, char, char8_t, concept, consteval, constinit, co_await, co_return, co_yield, double, false, float, int, long, short, signed, true, unsigned, requires, import, module, dllexport, dllimport, jintrinsic, naked, noalias, noinline, noreturn, nothrow, novtable, process, safebuffers, selectany, thread
