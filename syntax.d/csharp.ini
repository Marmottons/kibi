name=C#
extensions=cs
highlight_numbers=true
singleline_string_quotes="
singleline_comment_start=//
multiline_comment_delims=/*, */
# Keyword colors merged with the bat syntaxes by scripts/import_bat_syntaxes.py
highlight_function_calls=true
highlight_operators=true
highlight_punctuation=true
type_definition_keywords=class, delegate, namespace, new, struct
keywords_1=abstract, bool, break, byte, case, catch, char, class, const, continue, decimal, default, delegate, do, double, else, enum, event, explicit, extern, finally, fixed, float, for, foreach, goto, if, implicit, in, int, interface, internal, lock, long, namespace, new, object, operator, out, override, params, private, protected, public, readonly, ref, return, sbyte, sealed, short, sizeof, stackalloc, static, string, struct, switch, throw, try, typeof, uint, ulong, unchecked, unsafe, ushort, using, virtual, void, volatile, while, add, ascending, async, await, by, descending, dynamic, from, get, group, into, join, let, orderby, partial, remove, select, set, var, where, define, undef, elif, endif, error, warning, region, endregion, line, hidden, pragma, checksum, disable, restore, assembly, field, method, module, param, property, type, equals, on, when
keywords_2=alias, yield
builtins=false, null, true
types=checked, nameof
operators=as, is
