name=Elixir
extensions=ex,exs
highlight_numbers=true
singleline_string_quotes='
singleline_comment_start=%
multiline_comment_delims=/*, */
# Keyword colors merged with the bat syntaxes by scripts/import_bat_syntaxes.py
highlight_operators=true
highlight_punctuation=true
highlight_capitalized=true
function_definition_keywords=def
keywords_1=alias, case, catch, cond, def, do, else, end, fn, for, if, import, let, receive, return, throw, try, unless, when, while, abs, bit_size, byte_size, div, elem, hd, is_atom, is_binary, is_bitstring, is_boolean, is_exception, is_float, is_function, is_integer, is_list, is_map, is_nil, is_number, is_pid, is_port, is_record, is_reference, is_tuple, length, map_size, node, rem, round, tl, trunc, tuple_size, defmodule, defprotocol, defimpl, defmacro, defmacrop, defp, after, defdelegate, defexception, defguard, defguardp, defoverridable, defrecord, defstruct, exit, quote, raise, require, reraise, rescue, super, unquote, use, with
keywords_2=boolean, float, integer, list, map, pid, port, ref, tuple, unicode
builtins=nil, false, true
operators=and, in, not, or, xor
