name=Haskell
extensions=hs,lhs
highlight_numbers=true
singleline_string_quotes="
singleline_comment_start=--
multiline_comment_delims= {-, -}
# Keyword colors merged with the bat syntaxes by scripts/import_bat_syntaxes.py
highlight_operators=true
highlight_punctuation=true
type_definition_keywords=class, data, default, deriving, do, else, foreign, if, import, in, instance, let, module, newtype, of, then, type
keywords_1=case, class, data, default, deriving, do, else, foreign, if, import, in, instance, let, module, newtype, of, then, type, where, _, as, qualified, hiding, CONLIKE, DEPRECATED, INCLUDE, INCOHERENT, INLINABLE, INLINE, LANGUAGE, LINE, MINIMAL, NOINLINE, NOUNPACK, OPTIONS_GHC, OVERLAPPABLE, OVERLAPPING, OVERLAPS, RULES, SOURCE, SPECIALISE, SPECIALIZE, UNPACK, WARNING
keywords_2=export, label, dynamic, safe, unsafe, interruptible, True, False, Nothing, Just, Left, Right
types=Applicative, Bounded, Enum, Eq, Floating, Foldable, Fractional, Functor, Integral, Monad, Monoid, Num, Ord, Rational, Read, Real, RealFloat, RealFrac, Show, Traversable
operators=infix, infixl, infixr
