name=Go
extensions=go
highlight_numbers=true
singleline_string_quotes="
singleline_comment_start=//
multiline_comment_delims=/*, */
# Keyword colors merged with the bat syntaxes by scripts/import_bat_syntaxes.py
highlight_function_calls=true
highlight_operators=true
highlight_punctuation=true
type_definition_keywords=type
keywords_1=break, case, chan, const, continue, default, defer, else, fallthrough, for, func, go, goto, if, import, interface, map, package, range, return, select, struct, switch, type, var, block, define, end, template, with
keywords_2=false, nil, true, iota
builtins=make, new, append, cap, close, complex, copy, delete, imag, len, panic, print, println, real, recover, and, call, eq, ge, gt, html, index, js, le, lt, ne, not, or, printf, slice, urlquery
types=bool, byte, complex64, complex128, error, float32, float64, int, int8, int16, int32, int64, rune, string, uint, uint8, uint16, uint32, uint64, uintptr
