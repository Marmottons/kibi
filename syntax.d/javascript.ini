name=Javascript
extensions=js, mjs, cjs, jsx, es6
highlight_numbers=true
singleline_string_quotes=", ', `
singleline_comment_start=//
multiline_comment_delims=/*, */
multiline_string_delim="
# Keyword colors merged with the bat syntaxes by scripts/import_bat_syntaxes.py
highlight_function_calls=true
highlight_operators=true
highlight_punctuation=true
type_definition_keywords=class
function_definition_keywords=function
highlight_parameters=true
keywords_1=abstract, await, boolean, break, byte, case, catch, char, class, const, continue, debugger, default, do, double, else, enum, export, extends, final, finally, float, for, function, goto, if, implements, import, in, int, interface, let, long, native, new, null, package, private, protected, public, return, short, static, super, switch, synchronized, throw, throws, transient, try, var, volatile, while, with, yield, as, from, of, async, get, set, undefined, process, __dirname, __filename, exports, module, arch, argv, argv0, channel, config, connected, debugPort, env, execArgv, execPath, exitCode, mainModule, noDeprecation, pid, platform, ppid, release, stderr, stdin, stdout, throwDeprecation, title, traceDeprecation, version, versions, children, filename, id, loaded, parent, paths
keywords_2=false, true
builtins=this, NaN, Infinity, isArray, isView, add, and, compareExchange, exchange, isLockFree, load, or, store, sub, wait, wake, xor, asIntN, asUintN, UTC, now, parse, stringify, abs, acos, acosh, asin, atan, atan2, atanh, cbrt, ceil, clz32, cos, cosh, exp, expm1, floor, fround, hypot, imul, log, log10, log1p, log2, max, min, pow, random, round, sign, sin, sinh, sqrt, tan, tanh, trunc, isInteger, isSafeInteger, assign, create, defineProperties, defineProperty, entries, freeze, fromEntries, getOwnPropertyDescriptor, getOwnPropertyDescriptors, getOwnPropertyNames, getOwnPropertySymbols, getPrototypeOf, is, isExtensible, isFrozen, isSealed, keys, preventExtensions, seal, setPrototypeOf, values, all, allSettled, any, race, reject, resolve, revocable, apply, construct, deleteProperty, has, ownKeys, fromCharCode, fromCodePoint, raw, keyFor
types=Array, ArrayBuffer, BigInt, Date, Number, Object, Promise, Proxy, String, Symbol, Boolean, DataView, Function, Map, RegExp, Set, WeakMap, WeakSet, Error, EvalError, RangeError, ReferenceError, SyntaxError, TypeError, URIError, XMLHttpRequest, document, navigator, window, global, Buffer
functions=eval, constructor, decodeURI, decodeURIComponent, encodeURI, encodeURIComponent, isFinite, isNaN, parseFloat, parseInt, clearTimeout, setTimeout, require, abort, chdir, cpuUsage, cwd, disconnect, dlopen, emitWarning, exit, getegid, geteuid, getgit, getgroups, getuid, hasUncaughtExceptionCaptureCallback, hrtime, initGroups, kill, memoryUsage, nextTick, send, setegid, seteuid, setgid, setgroups, setuid, umask, uptime, assert, count, dir, error, group, groupCollapsed, groupEnd, info, profile, profileEnd, table, time, timeEnd, timeStamp, trace, warn, hasOwnProperty, isPrototypeOf, propertyIsEnumerable, toLocaleString, toString, valueOf, __defineGetter__, __defineSetter__, __lookupGetter__
