name=Perl
extensions=pl, pm, cgi
highlight_numbers=true
singleline_string_quotes=', "
singleline_comment_start= #
multiline_comment_delims=/*, */
multiline_string_delim="
# Keyword colors merged with the bat syntaxes by scripts/import_bat_syntaxes.py
highlight_function_calls=true
highlight_operators=true
highlight_punctuation=true
highlight_commands=true
type_definition_keywords=no, package, require, use
function_definition_keywords=sub
highlight_parameters=true
keywords_1=continue, do, else, elsif, for, if, unless, while, caller, die, dump, exit, format, last, local, my, next, no, our, package, require, use, sub, state, default, given, when, break, goto, redo, return, wait, foreach, until
builtins=__DATA__, __END__, __FILE__, __LINE__, __PACKAGE__, __SUB__, ARGV, ARGVOUT, DATA, IN, OUT, STDERR, STDIN, STDOUT
functions=abs, accept, alarm, atan2, bind, binmode, bless, chdir, chmod, chomp, chop, chown, chr, chroot, close, closedir, connect, cos, crypt, dbmclose, dbmopen, defined, delete, each, endgrent, endhostent, endnetent, endprotoent, endpwent, eof, eval, exec, exists, exp, fcntl, fileno, flock, fork, formline, getc, getgrent, getgrgid, getgrnam, gethostbyaddr, gethostbyname, gethostent, getlogin, getnetbyaddr, getnetbyname, getnetent, getpeername, getpgrp, getppid, getpriority, getprotobyname, getprotobynumber, getprotoent, getpwent, getpwnam, getpwuid, getservbyname, getservbyport, getservent, getsockname, getsockopt, glob, gmtime, grep, hex, import, index, int, ioctl, join, keys, kill, lc, lcfirst, length, link, listen, localtime, log, lstat, m, map, mkdir, msgctl, msgget, msgrcv, msgsnd, oct, open, opendir, ord, pack, pipe, pop, pos, print, printf, css, html, javascript, js, json, sql, xml, BEGIN, CHECK, END, INIT, UNITCHECK, AUTOLOAD, DESTROY, CSS, HTML, JAVASCRIPT, JSON, SQL, XML, qq, qr, qw, qx, tr
operators=and, cmp, eq, ge, gt, le, lt, ne, not, or, xor, as
