name=Markdown
extensions=md, markdown
highlight_numbers=false
# Inline code
singleline_string_quotes=`
# Fenced code blocks
multiline_string_delim=```
multiline_comment_delims=<!--, -->
# Keyword colors merged with the bat syntaxes by scripts/import_bat_syntaxes.py
highlight_markdown=true
keywords_1=#, ##, ###, ####, #####, ######
keywords_2=-, *, +, >
