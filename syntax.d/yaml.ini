name=YAML
extensions=yaml,yml
highlight_numbers=true
singleline_string_quotes='
singleline_comment_start=%
multiline_comment_delims=/*, */
# Keyword colors merged with the bat syntaxes by scripts/import_bat_syntaxes.py
highlight_punctuation=true
keys=functions
key_separators=:
key_separator=operators
unquoted_values=true
keywords_1=!!str, !!seq, !!map, !!int, !!float, !!bool, !!timestamp, YAML, TAG
keywords_2=true, false, yes, no, on, off
builtins=null, NULL, Null
