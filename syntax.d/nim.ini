; https://nim-lang.org
name=Nim
; https://github.com/nim-lang/Nim/wiki/Nim-for-C-programmers
extensions=nim, nims
highlight_numbers=true
singleline_string_quotes="
; https://nim-lang.org/docs/manual.html#lexical-analysis-comments
singleline_comment_start=#
multiline_comment_delims=#[, ]#
multiline_string_delim="
# Keyword colors merged with the bat syntaxes by scripts/import_bat_syntaxes.py
highlight_function_calls=true
plain_capitalized_calls=true
highlight_capitalized=true
highlight_commands=true
keywords_1=addr, as, asm, bind, block, break, case, cast, concept, const, continue, converter, defer, discard, distinct, div, do, elif, else, end, enum, except, export, finally, for, from, func, if, import, include, interface, iterator, let, macro, method, mixin, mod, object, of, out, proc, ptr, raise, ref, return, shl, shr, static, template, try, tuple, type, using, var, when, while, yield, int, int8, int16, int32, int64, uint, uint8, uint16, uint32, uint64, float, float32, float64, await, atomic, generic, lambda, shared, with, without, GC_ref, GC_unref, assert, countdown, countup, declared, defined, echo, high, len, low, new, newException, any, auto, bool, byte, cchar, cdouble, cfloat, char, cint, clong, clongdouble, clonglong, cschar, cshort, csize, cstring, cstringArray, cuchar, cuint, culong, culonglong, cushort, expr, float16, float8, stmt, string, tobject, typed, typedesc, untyped, array, natural, pointer, range, seq, set, openarray, varargs, void, tmpl, tmpli
builtins=nil, true, false, inf
